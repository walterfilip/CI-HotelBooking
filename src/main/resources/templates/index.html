<!DOCTYPE html>
<html lang="sv"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Hotellbokning</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="search-container">
    <h1 th:text="${title}"></h1>
    <p th:text="${subtitle}"></p>
    <form th:action="@{/rooms/search}" method="get">

        <div class="date-row">
            <label>Incheckning</label>
            <input type="date" name="startDate" >

            <label>Utcheckning</label>
            <input type="date" name="endDate">
        </div>

        <div class="room-row">
            <label>Rumstyp</label>
            <select name="roomType">
                <option value="SINGLE">Enkelrum</option>
                <option value="DOUBLE">Dubbelrum</option>
            </select>
        </div>

        <div th:if="${errorMessage}" class="error-container">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="search-rooms-button">
            <button type="submit">Sök lediga rum</button>
        </div>
    </form>

</div>
<br>

<div sec:authorize="isAnonymous()">

    <p th:if="${successMessage}"  th:text="${successMessage}" style="color: green; text-align: center">
    </p>
    <form th:action="@{/customers/login}" th:object="${customer}" method="post">
        <input type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
        <h1 class="login-row">Logga in</h1>
        <div class="login-row">
            <label>E-mail:</label>
            <input type="text" name="email">
        </div>

        <div class="login-row">
            <label>Lösenord:</label>
            <input type="password" name="password">
        </div>
        <p id="loginHelp" class="error-container" th:if="${loginError}" th:text="${loginError}"
           ></p>
        <div class="login-row">
            <button type="submit">Logga in</button>
        </div>
    </form>
</div>

<div sec:authorize="isAuthenticated()">
    <h2 class="login-row" th:text="${session.customerFirstName != null? 'Inloggad som ' + session.customerFirstName: 'Du är inloggad'}"></h2>

    <div class="login-row">
        <a th:href="@{/customers}">
            <button type="button">Min sida</button>
        </a>
        <form th:action="@{/customers/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit">Logga ut</button>
        </form>
    </div>

</div>
</body>
</html>
