name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
       mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hotelbooking
        ports:
          - 3306:3306
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/hotelbooking
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
      CUSTOMER_SERVICE_BASE_URL: http://localhost:8081

    steps:
      - name: Checkout HotelBooking
        uses: actions/checkout@v4
        with:
          path: hotelbooking

      - name: checkout CustomerService
        uses: actions/checkout@v4
        with:
          repository: walterfilip/CI-Customerservice
          path: customerservice


      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven


      - name: Start up CustomerService
        working-directory: hotelbooking
        run: docker compose up -d --build customer-service

      - name: Show CustomerService logs
        if: always()
        working-directory: hotelbooking
        run: docker compose logs customer-service

      - name: Wait for Customerservice to start
        run: sleep 30

      - name: Test CustomerService endpoint
        run: curl -f http://localhost:8081/api/customers/1

      - name: Build and run tests
        working-directory: hotelbooking
        run: mvn --batch-mode test

      - name: Stop Containers
        if: always()
        working-directory: hotelbooking
        run: docker compose down -v

